# 生产环境配置（Docker 部署使用）
# 所有敏感值来自环境变量，仓库中无任何明文密钥。
spring:
  datasource:
    url: ${PANDAGO_DB_URL:jdbc:mysql://mysql:3306/pandago?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${PANDAGO_DB_USER:}
    password: ${PANDAGO_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 5000
  data:
    redis:
      host: ${PANDAGO_REDIS_HOST:redis}
      port: ${PANDAGO_REDIS_PORT:6379}
      password: ${PANDAGO_REDIS_PASSWORD:}
      timeout: 2s

pandago:
  env: prod
  jwt:
    # 生产强制要求外部注入，不给任何本地兜底值（留空会导致启动失败，避免误用弱密钥）
    secret: ${PANDAGO_JWT_SECRET}
    expiration-ms: ${PANDAGO_JWT_EXPIRATION_MS:86400000}
  cache:
    enabled: ${PANDAGO_CACHE_ENABLED:true}
  order:
    timeout:
      minutes: ${PANDAGO_ORDER_TIMEOUT_MINUTES:30}
      batch-size: ${PANDAGO_ORDER_TIMEOUT_BATCH:100}
      schedule-enabled: true

logging:
  level:
    root: INFO
    # 生产关闭 SQL 与业务 DEBUG，避免日志过大与敏感信息泄露
    com.pandago: INFO
